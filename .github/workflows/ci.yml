name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
            mosaic-cli/target
          key: cargo-ci-${{ hashFiles('src-tauri/Cargo.lock', 'mosaic-cli/Cargo.lock') }}
          restore-keys: cargo-ci-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf ffmpeg mediainfo

      - name: Clippy (GUI-only, default features)
        working-directory: src-tauri
        run: cargo clippy -- -D warnings

      - name: Clippy (all targets, cli + test-api)
        working-directory: src-tauri
        run: cargo clippy --all-targets --features test-api,cli -- -D warnings

      - name: Clippy (mosaic-cli)
        working-directory: mosaic-cli
        run: cargo clippy --all-targets -- -D warnings

      - name: Unit tests
        working-directory: src-tauri
        run: cargo test --features test-api

      - name: CLI integration tests
        working-directory: mosaic-cli
        run: cargo test

  # Lint and link on Windows: MSVC linking (static C runtime) and
  # cfg(windows) code are invisible to the Linux job.
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
            mosaic-cli/target
          key: cargo-ci-windows-${{ hashFiles('src-tauri/Cargo.lock', 'mosaic-cli/Cargo.lock') }}
          restore-keys: cargo-ci-windows-

      - name: Clippy (GUI-only, default features)
        working-directory: src-tauri
        run: cargo clippy -- -D warnings

      - name: Clippy (all targets, cli + test-api)
        working-directory: src-tauri
        run: cargo clippy --all-targets --features test-api,cli -- -D warnings

      - name: Build mosaic-cli
        working-directory: mosaic-cli
        run: cargo build

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build:web

